<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <h2>Tip Calculator</h2>
        
        <div class="input-group">
            <label for="billTotal">Bill Total (₹)</label>
            <input type="number" id="billTotal" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="serviceTip">Tip Percentage (%)</label>
            <input type="number" id="serviceTip" placeholder="15" min="0" value="15">
        </div>

        <div class="input-group">
            <label for="personCount">Number of People</label>
            <input type="number" id="personCount" placeholder="1" min="1" value="1">
        </div>

        <hr>

        <div class="results">
            <div class="result-row">
                <span>Tip Per Person:</span>
                <span id="tipPerPerson" class="amount">₹0.00</span>
            </div>
            <div class="result-row">
                <span>Total Per Person:</span>
                <span id="totalPerPerson" class="amount">₹0.00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
